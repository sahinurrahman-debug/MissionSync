# Render Blueprint — MissionSync as ONE web service (Docker): API + the built dashboard on a single origin.
# The database is Neon (Postgres) — create a free project at https://neon.tech and paste its connection string.
#
#   Render dashboard → New → Blueprint → pick this repo. Render asks for the values marked `sync: false`.
#   Step-by-step: README.md → "Deploy".

services:
  - type: web
    name: missionsync
    runtime: docker
    plan: free                  # free web services sleep after ~15 min idle (cold start ~1 min)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV            # production: Secure cookies, and refuses to run on a throw-away SQLite file
        value: production
      - key: DATABASE_URL       # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
        sync: false
      - key: GROQ_API_KEY       # https://console.groq.com/keys — without it the agents run rule-based
        sync: false
      - key: XBD_SOURCE         # snapshot = the bundled real xBD records (no download); kaggle = live download
        value: snapshot
      - key: AUTO_DISPATCH      # false = agents propose, a human approves; true = demo auto-commit
        value: "false"
      - key: MAX_DRILLS_PER_USER
        value: "10"
      - key: MAX_LIVE_DRILLS    # drills simulated at once on this small instance
        value: "4"
      - key: MAX_GUESTS         # temporary demo accounts that may exist at once (each lives GUEST_HOURS=24)
        value: "60"
      - key: TRUSTED_PROXY_HOPS # Render's load balancer is one proxy in front of the app: only the rightmost X-Forwarded-For entry is believed
        value: "1"
      - key: LOG_FORMAT
        value: json
      - key: SENTRY_DSN         # optional error tracking (pip install sentry-sdk to activate)
        sync: false
