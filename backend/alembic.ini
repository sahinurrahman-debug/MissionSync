# Alembic is configured in code (missionsync/db/engine.py) and migrations/env.py reads DATABASE_URL.
# This file only exists so the `alembic` CLI finds the migrations folder:
#   cd backend && alembic upgrade head          # apply
#   alembic revision -m "describe the change"   # new migration
#   alembic downgrade -1                        # roll back one
[alembic]
script_location = migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
