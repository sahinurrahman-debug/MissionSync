name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations build the schema from scratch
        run: |
          DATABASE_URL=sqlite:///ci-check.db alembic upgrade head
          DATABASE_URL=sqlite:///ci-check.db alembic downgrade 0001
          DATABASE_URL=sqlite:///ci-check.db alembic upgrade head
      - run: python -m pytest -q --cov=missionsync --cov-report=term-missing:skip-covered   # LLM calls are faked; no secrets needed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:contrast      # WCAG AA on every token pair, both themes
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The production image builds
        run: docker build -t missionsync .
