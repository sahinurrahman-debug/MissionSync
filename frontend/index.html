<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MissionSync — one live, ranked operational picture for volunteer emergency-response drills. Typed field reports become structured incidents, ranked and matched to units in real time." />
    <meta name="theme-color" content="#0E1113" />
    <title>MissionSync — Live Drill Board</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1113'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232DD4BF' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5484d'/%3E%3C/svg%3E" />
    <script>
      // Restore theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('ms-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>MissionSync needs JavaScript enabled to run the live drill board.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
